<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The SWN mark for the browser tab, with no background: the letters drawn
       as strokes (a tab icon cannot load the site's fonts) over the accent
       line. The letters follow the browser's theme, dark ink on a light tab
       bar and light on a dark one, so they never vanish into it. The N stems sit
       on x = 46 and 58: at 16 px each lands on one whole pixel column, so the N
       is as dark as the S and W instead of smearing into grey. -->
  <style>
    .ink { stroke: #16122b; }
    .line { stroke: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f4f1ff; }
      .line { stroke: #7cf7d4; }
    }
  </style>
  <g class="ink" fill="none" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.1 16.6C19.8 14.3 17.4 13 14.6 13 10.9 13 8.5 15.6 8.5 19.2c0 7.9 13 4.5 13 12.2 0 3.8-2.6 6.2-6.6 6.2-3.1 0-5.7-1.5-6.9-4.1"/>
    <path d="M25.2 13.4l3.9 24.2 4.3-17.5 4.3 17.5 3.9-24.2"/>
    <path d="M46 37.6V13.4L58 37.6V13.4"/>
  </g>
  <path class="line" d="M8.5 50h49.5" stroke-width="4" stroke-linecap="round"/>
</svg>
